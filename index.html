<style>
:root{
  color-scheme: light;
  --bg:#f6f5f0; --bg-soft:#ecebe3; --card:#ffffff; --text:#1d2420; --muted:#5a645e;
  --border:#e0ded4; --border-strong:#c3c1b3; --field:#8a8f86;
  --primary-rgb:47,93,80; --primary:#2f5d50; --primary-dark:#21453b; --primary-soft:rgba(var(--primary-rgb),.09);
  --on-primary:#ffffff;
  --accent-rgb:176,84,52; --accent:#b05434; --accent-soft:rgba(var(--accent-rgb),.13); --accent-text:#8a3a1f;
  --ok:#2f8f4a; --ok-text:#1d6b34; --ok-soft:#e7f5eb;
  --warn:#c27c0e; --warn-text:#8a5300; --warn-soft:#fdf3e1;
  --bad:#c43a2f; --bad-text:#a82c22; --bad-soft:#fbe9e7;
  --info:#2d78b0; --info-text:#1f5f91; --info-soft:#e6f0f8;
  --font:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",P052,"TeX Gyre Pagella",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --shadow-sm:0 1px 2px rgba(30,36,24,.06);
  --shadow:0 1px 2px rgba(30,36,24,.05),0 8px 24px rgba(30,36,24,.07);
  --shadow-lg:0 4px 10px rgba(30,36,24,.08),0 20px 48px rgba(30,36,24,.14);
  --ease:cubic-bezier(.2,.7,.2,1); --max:1200px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11150f; --bg-soft:#191e17; --card:#1d241f; --text:#e9ede6; --muted:#a9b3a8;
    --border:#2c362e; --border-strong:#3f4b41; --field:#708071;
    --primary-rgb:131,196,172; --primary:#83c4ac; --primary-dark:#b2dccb; --on-primary:#0f1512;
    --accent-rgb:234,146,107; --accent:#ea926b; --accent-text:#f4b596;
    --ok:#5cc27a; --ok-text:#7fd497; --ok-soft:rgba(92,194,122,.13);
    --warn:#f0b24a; --warn-text:#f5c56f; --warn-soft:rgba(240,178,74,.13);
    --bad:#f07166; --bad-text:#f59189; --bad-soft:rgba(240,113,102,.13);
    --info:#69b2e0; --info-text:#8cc6ea; --info-soft:rgba(105,178,224,.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,.45); --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.34); --shadow-lg:0 4px 10px rgba(0,0,0,.5),0 20px 48px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11150f; --bg-soft:#191e17; --card:#1d241f; --text:#e9ede6; --muted:#a9b3a8;
  --border:#2c362e; --border-strong:#3f4b41; --field:#708071;
  --primary-rgb:131,196,172; --primary:#83c4ac; --primary-dark:#b2dccb; --on-primary:#0f1512;
  --accent-rgb:234,146,107; --accent:#ea926b; --accent-text:#f4b596;
  --ok:#5cc27a; --ok-text:#7fd497; --ok-soft:rgba(92,194,122,.13);
  --warn:#f0b24a; --warn-text:#f5c56f; --warn-soft:rgba(240,178,74,.13);
  --bad:#f07166; --bad-text:#f59189; --bad-soft:rgba(240,113,102,.13);
  --info:#69b2e0; --info-text:#8cc6ea; --info-soft:rgba(105,178,224,.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,.45); --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.34); --shadow-lg:0 4px 10px rgba(0,0,0,.5),0 20px 48px rgba(0,0,0,.5);
}
*,::before,::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);font-size:16.5px;line-height:1.6;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{line-height:1.2;text-wrap:balance;font-weight:700}
a{color:var(--primary-dark);text-underline-offset:2px}
::selection{background:rgba(var(--primary-rgb),.22)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-sm)}
button,input,select,textarea{font-family:inherit}

/* ---------- barra superior ---------- */
.bar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.bar-top{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px 6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);cursor:pointer;border:0;background:none;padding:0}
.brand-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:var(--shadow-sm)}
.brand-ico svg{width:22px;height:22px}
.brand-name{font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand-name b{color:var(--accent)}
.brand-sub{font-size:13px;color:var(--muted);font-style:italic}
.bar-top .sp{flex:1}
.ibtn{height:36px;min-width:36px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--card);color:var(--text);display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;font-weight:600}
.ibtn:hover{border-color:var(--primary);color:var(--primary-dark)}
.ibtn.round{padding:0;width:36px;justify-content:center}
.steps-nav{max-width:var(--max);margin:0 auto;display:flex;gap:4px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:thin}
.steps-nav button{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:none;color:var(--muted);padding:5px 11px 5px 6px;border-radius:var(--r-pill);font-size:14.5px;cursor:pointer;white-space:nowrap}
.steps-nav button:hover{color:var(--text);background:var(--primary-soft)}
.steps-nav .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--bg-soft);color:var(--muted);border:1px solid var(--border)}
.steps-nav button.act{background:var(--primary-soft);border-color:rgba(var(--primary-rgb),.35);color:var(--primary-dark);font-weight:700}
.steps-nav button.act .n{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.steps-nav button.done .n{background:var(--ok-soft);color:var(--ok-text);border-color:transparent}

/* ---------- contenido ---------- */
main{max-width:var(--max);margin:0 auto;padding:26px 20px 40px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--primary-dark)}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--primary)}
.bhead{margin:0 0 18px}
.bhead h1{font-size:clamp(1.7rem,1.2rem + 2vw,2.35rem);margin:6px 0 8px;letter-spacing:-.015em}
.lead{color:var(--muted);margin:0;max-width:78ch;font-size:17px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;margin:0 0 18px;box-shadow:var(--shadow-sm)}
.card>h2,.card>h3,.card .ch{margin:0 0 12px;font-size:19px}
.card h4{margin:16px 0 8px;font-size:15.5px}
.card.soft{background:var(--bg-soft);box-shadow:none}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
label.f .h{font-size:12.5px;font-style:italic}
input,select,textarea{font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--field);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:transparent}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--primary)}
input.num{text-align:right;max-width:112px;padding:5px 8px;font-variant-numeric:tabular-nums}
input:disabled{background:var(--bg-soft);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);border-radius:var(--r-md);padding:9px 18px;font-size:15.5px;font-weight:700;cursor:pointer;text-decoration:none;transition:background .15s var(--ease),transform .15s var(--ease)}
.btn:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--text);border-color:var(--border-strong)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary-dark);background:var(--card)}
.btn.link{background:none;border-color:transparent;color:var(--primary-dark);padding-left:6px;padding-right:6px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 11px;font-size:14px;font-weight:600}
.btn.lg{padding:13px 24px;font-size:17px}
.btn.danger{background:none;color:var(--bad-text);border-color:var(--bad)}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.opt{position:relative;border:1.5px solid var(--border);border-radius:var(--r-md);padding:13px 15px;cursor:pointer;background:var(--card);display:block;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:var(--primary);box-shadow:var(--shadow-sm)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel::after{content:"✓";position:absolute;top:10px;right:12px;width:20px;height:20px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:12px;display:grid;place-items:center;font-weight:700}
.opt b{display:block;font-size:16.5px;margin-bottom:2px;padding-right:24px}
.opt small{color:var(--muted);font-size:13.5px;line-height:1.45;display:block}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .badge{margin-top:6px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:2px 9px;border-radius:var(--r-pill);background:var(--bg-soft);color:var(--muted);border:1px solid var(--border)}
.badge.ok{background:var(--ok-soft);color:var(--ok-text);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn-text);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad-text);border-color:transparent}
.badge.info{background:var(--info-soft);color:var(--info-text);border-color:transparent}
.badge.pri{background:var(--primary-soft);color:var(--primary-dark);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-md);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 11px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{background:var(--bg-soft);color:var(--text);font-weight:700;font-size:13.5px;position:sticky;top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:var(--bg-soft)}
tbody tr:hover td{background:color-mix(in srgb,var(--primary-soft) 60%,transparent)}
tr.cat td{background:var(--bg);font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.wrap{white-space:normal}
.alert{border-radius:var(--r-md);padding:13px 16px;margin:0 0 16px;border:1px solid;border-left-width:4px}
.alert p{margin:4px 0}
.alert ul{margin:6px 0 0;padding-left:22px}
.alert.info{background:var(--info-soft);border-color:var(--info)}
.alert.ok{background:var(--ok-soft);border-color:var(--ok)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)}
.idea{background:var(--bg-soft);border-left:4px solid var(--primary);border-radius:0 var(--r-md) var(--r-md) 0;padding:11px 16px;margin:12px 0}
.idea b:first-child{display:block;color:var(--primary-dark)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));margin:0 0 18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--shadow-sm)}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;color:var(--primary-dark)}
.kpi .s{font-size:13px;color:var(--muted)}
.bar-h{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--primary),color-mix(in srgb,var(--primary) 70%,var(--accent)));min-width:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 12px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--border);color:var(--text)}
.next{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
.next .btn.big-next{flex-direction:column;align-items:flex-end;gap:0;padding:10px 20px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border:0;box-shadow:var(--shadow)}
.next .big-next small{font-size:12px;font-weight:500;opacity:.85}
.next .big-next span{font-size:16.5px}
code{font-family:var(--mono);background:var(--bg-soft);padding:1px 6px;border-radius:5px;font-size:.86em}
.hide{display:none!important}

/* ---------- teoría (acordeón numerado) ---------- */
.teoria{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:6px 22px 10px;margin:0 0 18px;box-shadow:var(--shadow-sm);border-top:4px solid var(--primary)}
.teoria>.th{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 0 6px}
.teoria>.th h2{margin:0;font-size:20px}
.teoria>.th p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.teoria details{border-bottom:1px solid var(--border)}
.teoria details:last-child{border-bottom:0}
.teoria summary{cursor:pointer;list-style:none;padding:12px 0;font-weight:600;display:flex;gap:10px;align-items:center}
.teoria summary::-webkit-details-marker{display:none}
.teoria summary::before{content:"▸";color:var(--muted);transition:transform .15s;display:inline-block}
.teoria details[open] summary::before{transform:rotate(90deg)}
.teoria details[open] summary{color:var(--primary-dark)}
.teoria .tb{padding:0 0 14px 22px;max-width:92ch}
.teoria .tb p,.teoria .tb li{margin:6px 0}
.teoria .tb table{font-size:14px;margin:8px 0}

/* ---------- inicio ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--border);background:
  radial-gradient(1200px 400px at 110% -10%,rgba(var(--accent-rgb),.14),transparent 60%),
  radial-gradient(900px 500px at -10% 120%,rgba(var(--primary-rgb),.13),transparent 60%),var(--card);
  padding:clamp(22px,4vw,48px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(2.1rem,1.3rem + 3.3vw,3.4rem);line-height:1.08;margin:14px 0 16px;letter-spacing:-.02em}
.hero h1 em{font-style:italic;color:var(--primary)}
.hero h1 .acc{color:var(--accent)}
.hero p.big{font-size:18.5px;color:var(--muted);margin:0 0 22px;max-width:56ch}
.hero p.big b{color:var(--text)}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.illus{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.illus .ic{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow-sm)}
.illus .ic.wide{grid-column:1/-1}
.illus .ic .t{font-size:12px;color:var(--muted);margin-bottom:4px}
.illus svg{width:100%;height:auto;display:block}
.section-t{margin:40px 0 4px;font-size:26px}
.section-l{margin:0 0 16px;color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);overflow:hidden}
.howto div{padding:14px 16px;border-right:1px solid var(--border)}
.howto div:last-child{border-right:0}
.howto .k{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--primary-dark)}
.howto b{display:block;margin:2px 0 4px}
.howto span{font-size:13.5px;color:var(--muted);line-height:1.4;display:block}
.inc{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.inc button{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-sm);display:flex;gap:14px;align-items:flex-start;transition:border-color .15s,transform .15s}
.inc button:hover{border-color:var(--primary);transform:translateY(-2px)}
.inc .num{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-dark);font-weight:700}
.inc h3{margin:2px 0 4px;font-size:18px}
.inc p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
.why{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 26px;margin-top:36px}
.why h3{margin:0 0 8px;font-size:19px}
.why .cite{font-size:14px;color:var(--muted)}

// ---------- Redes (Freeman 1978; Brandes 2001) ----------
// nodos: [{id}], aristas: [{a,b,w}] no dirigidas. Distancia de una arista = 1/w (vínculo más fuerte = más cerca).
function metricasRed(nodos, aristas){
  const n = nodos.length, idx = new Map(nodos.map((d,i)=>[d.id,i]));
  const ady = Array.from({length:n}, ()=>[]);
  for(const e of aristas){ const i=idx.get(e.a), j=idx.get(e.b); if(i==null||j==null||i===j) continue; const w=+e.w||1;
    ady[i].push([j,w]); ady[j].push([i,w]); }
  const grado = ady.map(l=>l.reduce((s,[,w])=>s+w,0));        // grado ponderado (fuerza)
  const gradoN = ady.map(l=>l.length);
  const bet = new Array(n).fill(0), cerc = new Array(n).fill(0);
  for(let s=0;s<n;s++){ // Dijkstra + acumulación de Brandes
    const S=[], P=Array.from({length:n},()=>[]), sig=new Array(n).fill(0), d=new Array(n).fill(Infinity);
    sig[s]=1; d[s]=0; const Q=[[0,s]], hecho=new Array(n).fill(false);
    while(Q.length){ Q.sort((x,y)=>x[0]-y[0]); const [dv,v]=Q.shift(); if(hecho[v]) continue; hecho[v]=true; S.push(v);
      for(const [w,wt] of ady[v]){ const nd=dv+1/wt;
        if(nd < d[w]-1e-12){ d[w]=nd; Q.push([nd,w]); sig[w]=sig[v]; P[w]=[v]; }
        else if(Math.abs(nd-d[w])<1e-12){ sig[w]+=sig[v]; P[w].push(v); } } }
    const del=new Array(n).fill(0);
    while(S.length){ const w=S.pop(); for(const v of P[w]) del[v]+= sig[v]/sig[w]*(1+del[w]); if(w!==s) bet[w]+=del[w]; }
    const alc = d.filter((x,i)=>i!==s && isFinite(x)); const sum = alc.reduce((a,b)=>a+b,0);
    cerc[s] = sum>0 ? (alc.length/(n-1)) * (alc.length/sum) : 0;   // cercanía (Wasserman–Faust, componentes)
  }
  for(let i=0;i<n;i++) bet[i]/=2;                                  // red no dirigida
  const m = aristas.length, dens = n>1 ? 2*m/(n*(n-1)) : 0;
  return {nodos: nodos.map((d,i)=>({id:d.id, grado:grado[i], vecinos:gradoN[i], inter:bet[i], cerc:cerc[i]})), densidad:dens};
}

// ---------- MICMAC (Godet 2007) ----------
// M: matriz cuadrada de influencias directas (0 nula, 1 débil, 2 media, 3 fuerte). Fila i influye sobre columna j.
// Directo: motricidad = suma de fila, dependencia = suma de columna.
// Indirecto: se eleva M a potencias M^k hasta que la jerarquía de motricidad y dependencia se estabiliza.
function micmac(M, kmax=8){
  const n = M.length; const z = (a)=>a.map(r=>r.slice());
  const mult=(A,B)=>A.map((r,i)=>B[0].map((_,j)=>r.reduce((s,_,k)=>s+A[i][k]*B[k][j],0)));
  const sumas=(A)=>({mot:A.map(r=>r.reduce((s,x)=>s+x,0)), dep:A[0].map((_,j)=>A.reduce((s,r)=>s+r[j],0))});
  const rango=(v)=>{ const o=v.map((x,i)=>[x,i]).sort((a,b)=>b[0]-a[0]); const r=new Array(v.length); o.forEach(([,i],k)=>r[i]=k); return r; };
  const dir = sumas(M); let P = z(M), k = 1, prev = null, ind = dir;
  for(; k<kmax; k++){ P = mult(P, M); const s = sumas(P); const rk = rango(s.mot).join(',')+'|'+rango(s.dep).join(',');
    // normaliza para no desbordar
    const mx = Math.max(1e-9, ...P.flat()); P = P.map(r=>r.map(x=>x/mx)); ind = sumas(P);
    if(rk===prev) break; prev = rk; }
  const norm=(v)=>{ const t=v.reduce((a,b)=>a+b,0)||1; return v.map(x=>100*x/t); };
  const res = (s)=>{ const mot=norm(s.mot), dep=norm(s.dep), mm=100/n;
    return mot.map((m,i)=>({i, mot:m, dep:dep[i], zona: m>=mm ? (dep[i]>=mm ? 'enlace' : 'motriz') : (dep[i]>=mm ? 'dependiente' : 'autonoma')})); };
  return {directo: res(dir), indirecto: res(ind), iter:k, umbral:100/n};
}
const ZONAS_MICMAC = {
  motriz:['Motrices (influyentes)','Drivers (influential)','Mucha influencia, poca dependencia: palancas del sistema.','High influence, low dependence: system levers.'],
  enlace:['De enlace (clave)','Linkage (key)','Influyen y dependen: inestables, todo cambio repercute.','Influence and depend: unstable, every change propagates.'],
  dependiente:['Dependientes (resultado)','Dependent (outcome)','Reflejan el efecto de las demás.','Reflect the effect of the others.'],

// ---------- MACTOR (Godet 2007) ----------
// MID: influencias directas entre actores (0–4). MIDI_ij = MID_ij + Σ_k min(MID_ik, MID_kj).
// Mi (influencia) = Σ_j MIDI_ij − MIDI_ii ; Di (dependencia) = Σ_j MIDI_ji − MIDI_ii
// Ri* = (Mi/ΣM)·Mi/(Mi+Di) ; ri = Ri*/promedio(R*) (relación de fuerza)
// MAO: posición de cada actor ante cada objetivo (−3…+3). 3MAO_ik = MAO_ik · ri
// Convergencia/divergencia entre actores i, j: Σ_k (|3MAO_ik|+|3MAO_jk|)/2 sobre objetivos de mismo signo / signo opuesto.
function mactor(MID, MAO){
  const n = MID.length;
  const MIDI = MID.map((r,i)=>r.map((x,j)=>{ let s=x; for(let k=0;k<n;k++) if(k!==i&&k!==j) s+=Math.min(MID[i][k],MID[k][j]); return i===j?0:s; }));
  const M = MIDI.map((r,i)=>r.reduce((s,x,j)=>s+(j===i?0:x),0));
  const D = MIDI[0].map((_,j)=>MIDI.reduce((s,r,i)=>s+(i===j?0:r[j]),0));
  const sM = M.reduce((a,b)=>a+b,0)||1;
  const R = M.map((m,i)=> (m+D[i])>0 ? (m/sM)*(m/(m+D[i])) : 0);
  const mR = R.reduce((a,b)=>a+b,0)/n || 1; const r = R.map(x=>x/mR);
  const P3 = MAO.map((fila,i)=>fila.map(x=>x*r[i]));
  const conv = [], div = [];
  for(let i=0;i<n;i++){ conv.push([]); div.push([]); for(let j=0;j<n;j++){ let c=0,d=0;
    if(i!==j) P3[i].forEach((x,k)=>{ const y=P3[j][k]; if(x===0||y===0) return; const v=(Math.abs(x)+Math.abs(y))/2; if(Math.sign(x)===Math.sign(y)) c+=v; else d+=v; });
    conv[i].push(c); div[i].push(d); } }
  const movil = MAO[0] ? MAO[0].map((_,k)=>({pro:P3.reduce((s,f)=>s+(f[k]>0?f[k]:0),0), contra:P3.reduce((s,f)=>s+(f[k]<0?-f[k]:0),0)})) : [];
  return {MIDI, M, D, r, P3, conv, div, movil};
}

function valorPrecepto(p, conteo){ const c = Math.max(0, +conteo||0); if(p.n===8) return c>0 ? 1 : 0; return Math.min(p.max, +(c*p.paso).toFixed(2)); }

// ---------- Escenarios futuribles (no lineales) ----------
// Trayectoria logística entre el estado actual x0 y el deseado xd con tasa k y punto de inflexión t0 (años):
//   x(t) = x0 + (xd − x0)·L(t), con L(t) = [σ(k(t−t0)) − σ(−k t0)] / [1 − σ(−k t0)]   (L(0)=0, L(∞)=1)
// Tres escenarios: deseable (alcanza la meta), tendencial (fracción a de la meta), regresivo (retrocede una fracción b).
function trayectoria(x0, xd, k, t0, H, frac){ const s=(z)=>1/(1+Math.exp(-z)); const b=s(-k*t0);
  const out=[]; for(let t=0;t<=H;t++){ const L=(s(k*(t-t0))-b)/(1-b); out.push(x0 + (xd-x0)*frac*L); } return out; }

// ---------- Ahorro de recursos ----------
// Para cada recurso: ahorro por hectárea = convencional − local; total = ahorro × superficie; % = ahorro / convencional.
function ahorro(filas, ha){ return filas.map(f=>{ const c=+f.conv, l=+f.local; const ok = isFinite(c)&&isFinite(l)&&f.conv!==''&&f.local!=='';
  const a = ok ? c-l : null; return {...f, ah:a, tot: ok ? a*ha : null, pct: ok && c ? 100*a/c : null}; }); }

// Día del año (0–364) del centro de la ventana de cada paso. Para pasos con DDS se usa la fecha de siembra elegida.
const MES_DIA = [0,31,59,90,120,151,181,212,243,273,304,334];
function diaPaso(p, siembraDia){ if(p.dds){ const m = p.dds.length>1 ? (p.dds[0]+p.dds[1])/2 : p.dds[0]; return (siembraDia + m) % 365; }
  const v = p.v; const a = MES_DIA[v[0]-1], b = MES_DIA[v[v.length-1]-1] + 30; let c = (a + b)/2; if(v.length>1 && v[0]>v[v.length-1]) c = (a + b + 365)/2;
  return c % 365; }

// tooltip global
let TIP;
function tip(ev, html){ if(!TIP){ TIP=document.createElement('div'); TIP.className='tip'; document.body.appendChild(TIP); }
  if(!html){ TIP.classList.remove('on'); return; } TIP.innerHTML=html; TIP.classList.add('on');
  const x=Math.min(ev.clientX+14, innerWidth-TIP.offsetWidth-8), y=Math.min(ev.clientY+14, innerHeight-TIP.offsetHeight-8); TIP.style.left=x+'px'; TIP.style.top=y+'px'; }
function enlazarTips(raiz){ raiz.querySelectorAll('[data-tip]').forEach(el=>{ el.addEventListener('mousemove',e=>tip(e,el.getAttribute('data-tip'))); el.addEventListener('mouseleave',()=>tip(null)); }); }

// ---------- Trama de telar (decorativa) ----------
function trama(w=1200,h=320){ let s=`<svg class="trama" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">`;

// ---------- Red (disposición por fuerzas, determinista) ----------
function disponerRed(nodos, aristas, W, H){ const n=nodos.length; const P=nodos.map((d,i)=>({x:W/2+Math.cos(2*Math.PI*i/n)*W*0.3, y:H/2+Math.sin(2*Math.PI*i/n)*H*0.3}));
  const idx=new Map(nodos.map((d,i)=>[d.id,i])); const k=Math.sqrt(W*H/Math.max(n,1))*0.95;
  for(let it=0;it<300;it++){ const F=P.map(()=>({x:0,y:0})), temp=8*(1-it/300)+0.4;
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){ const dx=P[i].x-P[j].x, dy=P[i].y-P[j].y, d=Math.max(1,Math.hypot(dx,dy)), f=k*k/d; F[i].x+=dx/d*f; F[i].y+=dy/d*f; F[j].x-=dx/d*f; F[j].y-=dy/d*f; }
    aristas.forEach(e=>{ const i=idx.get(e.a), j=idx.get(e.b); if(i==null||j==null) return; const dx=P[i].x-P[j].x, dy=P[i].y-P[j].y, d=Math.max(1,Math.hypot(dx,dy)), f=d*d/k*0.35*(0.6+0.4*(+e.w||1)/3);
      F[i].x-=dx/d*f; F[i].y-=dy/d*f; F[j].x+=dx/d*f; F[j].y+=dy/d*f; });
    P.forEach((p,i)=>{ const m=Math.hypot(F[i].x,F[i].y)||1; p.x+=F[i].x/m*Math.min(m,temp*4); p.y+=F[i].y/m*Math.min(m,temp*4);
      p.x+= (W/2-p.x)*0.01; p.y+=(H/2-p.y)*0.01; p.x=Math.max(50,Math.min(W-50,p.x)); p.y=Math.max(40,Math.min(H-40,p.y)); }); }
  return P; }
function anillo(nodos, centro, W, H){ const otros=nodos.filter(d=>d.id!==centro), R=Math.min(W,H)*0.34; let k=0;
  return nodos.map(d=>{ if(d.id===centro) return {x:W/2,y:H/2}; const a=-Math.PI/2+2*Math.PI*(k++)/otros.length; return {x:W/2+R*Math.cos(a)*1.25, y:H/2+R*Math.sin(a)}; }); }
function dibujarRed(nodos, aristas, met, opt={}){ const W=opt.w||640, H=opt.h||420; const P=opt.centro ? anillo(nodos, opt.centro, W, H) : disponerRed(nodos, aristas, W, H); const idx=new Map(nodos.map((d,i)=>[d.id,i]));
  const clave=opt.clave||'inter'; const vals=met.nodos.map(m=>m[clave]); const mx=Math.max(...vals,1e-9);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  aristas.forEach(e=>{ const i=idx.get(e.a), j=idx.get(e.b); if(i==null||j==null) return;
    s+=`<line x1="${P[i].x}" y1="${P[i].y}" x2="${P[j].x}" y2="${P[j].y}" stroke="var(--border-strong)" stroke-width="${1+(+e.w||1)*1.2}" ${e.dash?'stroke-dasharray="5 5"':''} opacity=".85"/>`; });
  nodos.forEach((d,i)=>{ const m=met.nodos[i]; const r=14+22*(m[clave]/mx); const col=d.col||'var(--primary)';
    const t=`<b>${esc(d.nombre||d.id)}</b><br>${T('Grado ponderado','Weighted degree')}: ${f1(m.grado)}<br>${T('Intermediación','Betweenness')}: ${f1(m.inter,2)}<br>${T('Cercanía','Closeness')}: ${f1(m.cerc,2)}`;
    s+=`<g data-tip="${esc(t)}"><circle cx="${P[i].x}" cy="${P[i].y}" r="${r}" fill="${col}" fill-opacity=".9" stroke="var(--card)" stroke-width="2"/>`+
       `<text x="${P[i].x}" y="${P[i].y+.5}" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="700" style="fill:#fff">${esc(d.id)}</text>`+
       `<text x="${P[i].x}" y="${P[i].y+r+14}" text-anchor="middle" font-size="12" class="m">${esc((d.nombre||'').slice(0,28))}</text></g>`; });
  return s+'</svg>'; }

// ---------- Plano influencia–dependencia (MICMAC) ----------
function planoMicmac(res, etiquetas, um){ const W=620,H=470,L=60,B=48,R=20,Tp=20;
  const dom=(v)=>{ let a=Math.min(...v,um), b=Math.max(...v,um); const p=Math.max((b-a)*0.18, um*0.05); return [Math.max(0,a-p), b+p]; };
  const [x0,x1]=dom(res.map(r=>r.dep)), [y0,y1]=dom(res.map(r=>r.mot));
  const X=(v)=>L+(v-x0)/(x1-x0)*(W-L-R), Y=(v)=>H-B-(v-y0)/(y1-y0)*(H-B-Tp);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  const zonas=[['motriz',L,Tp,X(um)-L,Y(um)-Tp],['enlace',X(um),Tp,W-R-X(um),Y(um)-Tp],['autonoma',L,Y(um),X(um)-L,H-B-Y(um)],['dependiente',X(um),Y(um),W-R-X(um),H-B-Y(um)]];
  const cz={motriz:'var(--accent)',enlace:'var(--bad)',autonoma:'var(--muted)',dependiente:'var(--info)'};
  zonas.forEach(([z,x,y,w,h])=>{ s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${cz[z]}" fill-opacity=".06"/><text x="${x+8}" y="${y+18}" font-size="12.5" font-weight="700" style="fill:${cz[z]}">${esc(T(ZONAS_MICMAC[z][0],ZONAS_MICMAC[z][1]))}</text>`; });
  s+=`<line class="ax" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/><line class="ax" x1="${L}" y1="${Tp}" x2="${L}" y2="${H-B}"/>`+
     `<line x1="${X(um)}" y1="${Tp}" x2="${X(um)}" y2="${H-B}" stroke="var(--border-strong)" stroke-dasharray="4 4"/><line x1="${L}" y1="${Y(um)}" x2="${W-R}" y2="${Y(um)}" stroke="var(--border-strong)" stroke-dasharray="4 4"/>`+
     [0,.5,1].map(t=>`<text x="${X(x0+t*(x1-x0))}" y="${H-B+15}" text-anchor="middle" font-size="11" class="m">${f1(x0+t*(x1-x0))}</text><text x="${L-6}" y="${Y(y0+t*(y1-y0))+4}" text-anchor="end" font-size="11" class="m">${f1(y0+t*(y1-y0))}</text>`).join('')+
     `<text x="${(L+W-R)/2}" y="${H-10}" text-anchor="middle" font-size="13" class="m">${T('Dependencia (%)','Dependence (%)')}</text>`+
     `<text transform="translate(16 ${(Tp+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="13" class="m">${T('Influencia / motricidad (%)','Influence (%)')}</text>`;
  const usados=[]; res.forEach(r=>{ const x=X(r.dep); let y=Y(r.mot); let ly=y+4; while(usados.some(u=>Math.abs(u[0]-x)<90&&Math.abs(u[1]-ly)<13)) ly+=13; usados.push([x,ly]); s+=`<g data-tip="${esc('<b>'+etiquetas[r.i]+'</b><br>'+T('Influencia','Influence')+' '+f1(r.mot)+' %<br>'+T('Dependencia','Dependence')+' '+f1(r.dep)+' %')}"><circle cx="${x}" cy="${y}" r="7" fill="${cz[r.zona]}"/>`+
    `<text x="${x+10}" y="${ly}" font-size="12">${esc(etiquetas[r.i].slice(0,22))}</text></g>`; });
  return s+'</svg>'; }

PINTA.red_ev = (el)=>{ const u=ST.red;

function espejo(){ const S=110, W=3*S+90, H=3*S+70; let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=0;i<3;i++) for(let j=0;j<3;j++){ const c=i===1&&j===1; s+=`<rect x="${60+i*S}" y="${20+j*S}" width="${S-4}" height="${S-4}" rx="8" fill="${c?'var(--accent)':'var(--primary)'}" fill-opacity="${c?.18:.06}" stroke="var(--border)"/>`; }

     `<text transform="translate(18 ${20+1.5*S}) rotate(-90)" text-anchor="middle" font-size="12.5" class="m">Y: ${T('uso racional','rational use')}</text>`;

  return s+'</svg>'; }

PINTA.prospectiva = ()=>{ const etiq=VARS_MICMAC.map(v=>T(v[0],v[1])); const M=ST.mic.M; const tot=M.flat().reduce((a,b)=>a+b,0);

     <p class="nota sci">${T('Directo: motricidad = suma de la fila; dependencia = suma de la columna (en %). Indirecto: se eleva la matriz a potencias hasta que la jerarquía se estabiliza (Godet, 2007). Umbrales: el promedio','Direct: influence = row sum; dependence = column sum (%). Indirect: matrix powers until the ranking stabilises (Godet, 2007). Thresholds: mean')} (${f1(mm.umbral)} %).</p></div></div>`

PINTA.tablero = ()=>{ const pr=promPrec(); const mu=metricasRed(ST.red.nodos, ST.red.aristas); const e=estadoDe(ST.est), m=munDe(ST.est,ST.mun);
  const odsCubiertos = new Set(DIMENSIONES.flatMap(d=>d.ods)); const v=valsPrec();

   <div class="kpi"><div class="l">${T('Densidad de tu red','Your network density')}</div><div class="v">${f1(mu.densidad,2)}</div><div class="s">${ST.red.nodos.length} ${T('actores','actors')} · ${ST.red.aristas.length} ${T('vínculos','ties')}</div></div>

function telarSistema(){ const W=560,H=380; const hilos=[['Territorio','Territory','var(--tierra)'],['Stack (5B)','Stack (5B)','var(--semilla)'],['Actores','Actors','var(--accent)'],['Recursos','Resources','var(--info)'],['Dimensiones','Dimensions','var(--vigil)'],['ODS','SDGs','var(--ok)']];
  const tramas=[['Socioeconómico','Socio-economic'],['Ambiental','Environmental'],['Turístico-ecotec.','Tourism–eco-tech']];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`; const x0=150, dx=(W-x0-30)/(hilos.length-1);
  hilos.forEach((h,i)=>{ const x=x0+i*dx; s+=`<line x1="${x}" y1="30" x2="${x}" y2="${H-50}" stroke="${h[2]}" stroke-width="7" stroke-linecap="round" opacity=".85"/><text x="${x}" y="${H-28}" text-anchor="middle" font-size="12.5" font-weight="700">${esc(T(h[0],h[1]))}</text>`; });
  tramas.forEach((t,j)=>{ const y=80+j*95; let d=`M ${x0-20} ${y}`; hilos.forEach((h,i)=>{ const x=x0+i*dx; d+=` Q ${x-dx/2} ${y+((i+j)%2?16:-16)} ${x} ${y}`; });
    s+=`<path d="${d} L ${W-10} ${y}" fill="none" stroke="var(--text)" stroke-width="3" opacity=".55"/><text x="10" y="${y+4}" font-size="13" font-weight="700">${esc(T(t[0],t[1]))}</text>`; });
  s+=`<text x="${(x0+W)/2}" y="16" text-anchor="middle" font-size="12" class="m">${T('urdimbre: hilos del sistema · trama: fundamentos de la GEI','warp: system threads · weft: management foundations')}</text>`;
  return s+'</svg>'; }

PINTA.ciencia = ()=>`<div class="bhead"><div class="eyebrow">${T('Fundamentos','Foundations')}</div><h1>${T('Ciencia detrás del telar','Science behind the loom')}</h1>
  <p class="lead">${T('Sistemas complejos adaptativos, racionalidad ambiental, conocimiento tácito y explícito, análisis de redes y prospectiva estratégica.','Complex adaptive systems, environmental rationality, tacit and explicit knowledge, network analysis and strategic foresight.')}</p></div>
  <div class="grid g2">
   <div class="card"><h2>${T('Por qué un sistema complejo adaptativo','Why a complex adaptive system')}</h2>
    <p>${T('En la tesis, las relaciones entre los fundamentos interactúan de manera caórdica —entre el orden y el caos (Prigogine, 1983)—, en una estructura en red donde el todo no es la suma de las partes, cada elemento es un subsistema con autonomía y dependencia, y emergen atractores y resiliencia.','In the thesis, the foundations interact chaordically — between order and chaos (Prigogine, 1983) — in a network where the whole is not the sum of its parts, each element is a subsystem with autonomy and dependence, and attractors and resilience emerge.')}</p>
    <p>${T('En el artículo, el conocimiento local es un proceso dinámico de aprendizaje y adaptación: se construye experimentando en parcela, se transmite entre generaciones y se intercambia entre actores. El Stack lo ordena en capas interdependientes con cuatro rasgos: multidimensionalidad, jerarquización, interdisciplinariedad y aplicabilidad.','In the paper, local knowledge is a dynamic learning-and-adaptation process: built by experimenting in the field, passed between generations and exchanged between actors. The Stack orders it in interdependent layers with four traits: multidimensionality, hierarchy, interdisciplinarity and applicability.')}</p>${fuenteTesis()}${fuenteArt()}</div>
   <div class="card"><h2>${T('Fórmulas','Formulas')}</h2>
    <p><b>${T('Valor de un precepto','Precept value')}</b></p><div class="formula">vᵢ = min(1, nᵢ · pᵢ) ; ${T('precepto 8','precept 8')}: v₈ = 1 ${T('si','if')} n₈ &gt; 0</div>
    <p><b>${T('Nivel de conocimiento ambiental','Environmental knowledge level')}</b></p><div class="formula">NCA = (VC + VRUP) × VMPUP</div>
    <p><b>${T('Centralidad e intermediación','Centrality and betweenness')}</b></p><div class="formula">C_B(v) = Σ_{s≠v≠t} σ_st(v) / σ_st ; C_C(v) = (r/(n−1)) · (r / Σ_t d(v,t))</div>
    <p><b>MICMAC</b></p><div class="formula">I_i = Σ_j M_ij ; D_j = Σ_i M_ij ; ${T('indirecto','indirect')}: M^k</div>
    <p><b>MACTOR</b></p><div class="formula">MIDI_ij = MID_ij + Σ_k min(MID_ik, MID_kj) ; r_i = R_i*/R̄*</div>
    <p><b>${T('Escenario logístico','Logistic scenario')}</b></p><div class="formula">x(t) = x₀ + (x_d − x₀)·a·L(t)</div></div></div>
  <div class="card"><h2>${T('Referencias','References')}</h2><ol>
   <li>${esc(ART.cita)} <a href="https://doi.org/${ART.doi}" target="_blank" rel="noopener">https://doi.org/${ART.doi}</a></li>
   <li>${esc(TESIS.cita)}</li>
   <li>INEGI. 2020. Censo de Población y Vivienda 2020; ${T('Catálogo Único de Claves Geoestadísticas','geostatistical catalogue')}.</li>
   <li>Banco de México. Reporte sobre las Economías Regionales (${T('regionalización','regionalisation')}).</li>
   <li>${T('Naciones Unidas','United Nations')}. 2015. ${T('Transformar nuestro mundo: la Agenda 2030 para el Desarrollo Sostenible','Transforming our world: the 2030 Agenda for Sustainable Development')}.</li>
   ${TEORIA.map(t=>`<li>${esc(t.c)} <span class="nota">— ${esc(t.t)}</span></li>`).join('')}</ol></div>
  <div class="card"><h2>${T('Alcances y límites','Scope and limits')}</h2><ul>
   <li>${T('El caso documentado es Calpan, Puebla (maíz criollo). Para los demás municipios se muestra el catálogo oficial y se invita a documentar su propio Stack.','The documented case is Calpan, Puebla (landrace maize). Other municipalities show the official catalogue and invite documenting their own Stack.')}</li>
   <li>${T('Del IIC solo se publicaron 11 de los 38 valores; Ratio Telar no completa los faltantes.','Only 11 of 38 IIC values were published; Ratio Telar does not fill the gaps.')}</li>
   <li>${T('La red publicada informa centralidades por grupo, no los pesos de cada vínculo; la red que dibuja la app para Calpan es esquemática.','The published network reports group centralities, not tie weights; the Calpan network drawn here is schematic.')}</li>
   <li>${T('MICMAC, MACTOR y los escenarios son herramientas: sus resultados dependen de los juicios que capture el taller.','MICMAC, MACTOR and scenarios are tools: results depend on the judgements captured by the workshop.')}</li>
   <li>${T('La producción agrícola por municipio (SIAP) se integrará cuando su servicio de datos abiertos esté disponible.','Municipal crop production (SIAP) will be added when its open-data service is available.')}</li></ul></div>`;

// ---------- arranque ----------
function exportar(){ const b=new Blob([JSON.stringify({app:'Ratio Telar', version:CONFIG.version, fecha:new Date().toISOString(), territorio:{region:ST.reg, estado:ST.est, municipio:ST.mun}, estado:ST},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='ratio-telar.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function importar(f){ const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.estado&&d.estado.prec){ ST=Object.assign(estadoInicial(), d.estado); guardar(); repintar(); } }catch(e){ alert(T('Archivo no válido','Invalid file')); } }; r.readAsText(f); }
document.addEventListener('click',(e)=>{ const t=e.target.closest('[data-sec],[data-ir],[data-modo]'); if(!t) return;
  if(t.dataset.sec) ir(t.dataset.sec); else if(t.dataset.ir) ir(t.dataset.ir); else if(t.dataset.modo){ ST.modo=t.dataset.modo; guardar(); repintar(); } });
function arrancar(){ let g=null; try{ g=localStorage.getItem('ratio-telar-lang'); }catch(e){} LANG = g || ((navigator.language||'es').slice(0,2)==='en' ? 'en' : 'es');
  const tema = (()=>{ try{ return localStorage.getItem('ratio-telar-tema'); }catch(e){ return null; } })(); if(tema) document.documentElement.dataset.theme=tema;
  $('#bLang').onclick=()=>{ LANG = LANG==='es'?'en':'es'; try{ localStorage.setItem('ratio-telar-lang',LANG); }catch(e){} repintar(); };
  $('#bModo').onclick=()=>{ ST.modo = ST.modo==='prod'?'cien':'prod'; guardar(); repintar(); };
  $('#bTema').onclick=()=>{ const r=document.documentElement; const osc = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = osc?'light':'dark'; try{ localStorage.setItem('ratio-telar-tema', r.dataset.theme); }catch(e){} };
  $('#bExp').onclick=exportar; $('#fImp').onchange=(e)=>{ if(e.target.files[0]) importar(e.target.files[0]); };
  $('#bImp').onclick=()=>$('#fImp').click(); $('#bImpr').onclick=()=>print();
  $$('.sec').forEach(s=>s.classList.toggle('on', s.id==='s-'+ST.sec)); repintar(); }
document.addEventListener('DOMContentLoaded', arrancar);

</script>
